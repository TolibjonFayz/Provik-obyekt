<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROVIK — Obyektlar hisobi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F8F9FB;
    --bg-subtle: #F0F2F5;
    --panel: #FFFFFF;
    --ink: #1A1D21;
    --ink-secondary: #6B7280;
    --ink-tertiary: #9CA3AF;
    --border: #E5E7EB;
    --border-light: #F3F4F6;
    --primary: #2563EB;
    --primary-hover: #1D4ED8;
    --primary-light: #EFF6FF;
    --primary-ghost: rgba(37,99,235,0.06);
    --success: #059669;
    --success-light: #ECFDF5;
    --danger: #DC2626;
    --danger-light: #FEF2F2;
    --warning: #D97706;
    --warning-light: #FFFBEB;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.1);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #0F1117;
      --bg-subtle: #181B23;
      --panel: #1E2028;
      --ink: #F0F1F3;
      --ink-secondary: #9CA3AF;
      --ink-tertiary: #6B7280;
      --border: #2D3039;
      --border-light: #252830;
      --primary: #3B82F6;
      --primary-hover: #60A5FA;
      --primary-light: rgba(59,130,246,0.12);
      --primary-ghost: rgba(59,130,246,0.06);
      --success: #34D399;
      --success-light: rgba(52,211,153,0.12);
      --danger: #F87171;
      --danger-light: rgba(248,113,113,0.12);
      --warning: #FBBF24;
      --warning-light: rgba(251,191,36,0.12);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg: #0F1117;
    --bg-subtle: #181B23;
    --panel: #1E2028;
    --ink: #F0F1F3;
    --ink-secondary: #9CA3AF;
    --ink-tertiary: #6B7280;
    --border: #2D3039;
    --border-light: #252830;
    --primary: #3B82F6;
    --primary-hover: #60A5FA;
    --primary-light: rgba(59,130,246,0.12);
    --primary-ghost: rgba(59,130,246,0.06);
    --success: #34D399;
    --success-light: rgba(52,211,153,0.12);
    --danger: #F87171;
    --danger-light: rgba(248,113,113,0.12);
    --warning: #FBBF24;
    --warning-light: rgba(251,191,36,0.12);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.4);
  }
  html{ height:100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  /* ─── HEADER ─── */
  .header{
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(12px);
    background: color-mix(in srgb, var(--panel) 85%, transparent);
  }
  .header-inner{
    max-width: 1280px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap;
  }
  .logo{ display:flex; align-items:center; gap:10px; }
  .logo-icon{
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), #7C3AED);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 16px;
  }
  .logo-text{ font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .logo-sub{ font-size: 12px; color: var(--ink-tertiary); font-weight: 400; }
  .header-actions{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .header-actions .hbtn{
    background: var(--bg-subtle); color: var(--ink-secondary); border: none;
    border-radius: var(--radius-sm); padding: 7px 12px; font-size: 12.5px;
    font-weight: 500; cursor: pointer; transition: var(--transition);
    font-family: inherit; display:flex; align-items:center; gap:5px;
  }
  .header-actions .hbtn:hover{ background: var(--primary-light); color: var(--primary); }
  .header-actions .hbtn svg{ width:14px; height:14px; }

  /* ─── MAIN WRAP ─── */
  .wrap{ max-width: 1280px; margin: 0 auto; padding: 24px 24px 80px; }
  @media (max-width: 640px){ .wrap{ padding: 16px 16px 64px; } }

  /* ─── STAT CARDS ─── */
  .stats-grid{
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    margin-bottom: 24px;
  }
  @media (max-width: 640px){ .stats-grid{ grid-template-columns: 1fr; gap: 10px; } }
  .scard{
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 20px;
    box-shadow: var(--shadow-sm); transition: var(--transition);
    position: relative; overflow: hidden;
  }
  .scard::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    border-radius: var(--radius-md) var(--radius-md) 0 0;
  }
  .scard:nth-child(1)::before{ background: var(--primary); }
  .scard:nth-child(2)::before{ background: var(--danger); }
  .scard:nth-child(3)::before{ background: var(--success); }
  .scard .s-label{ font-size: 12px; color: var(--ink-tertiary); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
  .scard .s-value{ font-size: 24px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .scard:nth-child(1) .s-value{ color: var(--primary); }
  .scard:nth-child(2) .s-value{ color: var(--danger); }
  .scard:nth-child(3) .s-value{ color: var(--success); }
  .scard.profit.neg .s-value{ color: var(--danger) !important; }

  /* ─── LAYOUT ─── */
  .layout{
    display: grid; grid-template-columns: 300px 1fr; gap: 20px;
    align-items: start;
  }
  @media (max-width: 860px){ .layout{ grid-template-columns: 1fr; } }

  /* ─── PANELS ─── */
  .panel{
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  /* ─── OBJECT LIST ─── */
  .objlist-header{
    display:flex; justify-content:space-between; align-items:center;
    padding: 16px 20px 12px;
  }
  .objlist-header h2{
    font-size: 13px; font-weight: 600; color: var(--ink-tertiary);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .add-btn{
    background: var(--primary); color:#fff; border:none;
    border-radius: var(--radius-sm);
    width: 30px; height: 30px; font-size: 18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: var(--transition); font-weight: 400;
  }
  .add-btn:hover{ background: var(--primary-hover); transform: scale(1.05); }

  .obj-item{
    padding: 14px 20px; border-top: 1px solid var(--border-light);
    cursor:pointer; transition: var(--transition);
    display:flex; flex-direction:column; gap:6px;
  }
  .obj-item:hover{ background: var(--primary-ghost); }
  .obj-item.active{
    background: var(--primary-light);
    border-left: 3px solid var(--primary);
    padding-left: 17px;
  }
  .obj-item .name{
    font-weight: 600; font-size: 14px;
    display:flex; align-items:center; gap:8px; justify-content:space-between; flex-wrap:wrap;
  }
  .obj-item .meta{
    font-size: 12px; color: var(--ink-tertiary);
    display:flex; justify-content:space-between; align-items:center;
  }
  .obj-item .meta .p{ font-weight: 700; font-size: 13px; }
  .obj-item .meta .p.neg{ color: var(--danger); }
  .obj-item .meta .p.pos{ color: var(--success); }

  /* ─── BADGES ─── */
  .badge{
    font-size: 10px; font-weight: 600; border-radius: 6px;
    padding: 2px 8px; white-space:nowrap; text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .badge.status-jarayonda{ color: var(--primary); background: var(--primary-light); }
  .badge.status-tugallangan{ color: var(--success); background: var(--success-light); }
  .badge.status-toxtatilgan{ color: var(--danger); background: var(--danger-light); }
  .badge.nds{ color: var(--warning); background: var(--warning-light); }
  .badge.naqd{ color: var(--ink-tertiary); background: var(--bg-subtle); }

  .empty-list{ padding: 24px 20px; color: var(--ink-tertiary); font-size: 13px; text-align:center; }

  /* ─── DETAIL ─── */
  .detail-head{
    padding: 24px 24px 20px; border-bottom: 1px solid var(--border);
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;
  }
  .detail-head h2{ font-size: 20px; font-weight: 700; margin:0 0 4px; letter-spacing: -0.02em; }
  .detail-head .contract{ font-size: 13px; color: var(--ink-secondary); }

  .icon-btn{
    background: var(--bg-subtle); border: none; color: var(--ink-secondary);
    border-radius: var(--radius-sm); padding: 7px 12px; font-size: 12px;
    cursor:pointer; transition: var(--transition); font-weight: 500; font-family: inherit;
  }
  .icon-btn:hover{ background: var(--danger-light); color: var(--danger); }

  select.status-select{
    border: 1px solid var(--border); background: var(--bg-subtle); color: var(--ink);
    border-radius: var(--radius-sm); padding: 7px 10px; font-size: 12px;
    font-family: inherit; font-weight: 500; cursor:pointer;
  }

  /* ─── STAT ROW ─── */
  .stat-row{
    display:grid; grid-template-columns: repeat(3,1fr); gap:12px;
    padding: 20px 24px; border-bottom: 1px solid var(--border);
  }
  .stat .lbl{ font-size: 11px; color: var(--ink-tertiary); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat .val{ font-size: 18px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat.income .val{ color: var(--primary); }
  .stat.expense .val{ color: var(--danger); }
  .stat.profit .val{ color: var(--success); }
  .stat.profit.neg .val{ color: var(--danger); }

  /* ─── CATEGORY BARS ─── */
  .cat-bars{ padding: 16px 24px; border-bottom: 1px solid var(--border); display:flex; flex-direction:column; gap:10px; }
  .cat-bar-row{ display:flex; align-items:center; gap:12px; font-size: 12px; }
  .cat-bar-row .cn{ width: 160px; flex-shrink:0; color: var(--ink-secondary); font-weight: 500; }
  .cat-bar-row .track{ flex:1; height: 6px; background: var(--bg-subtle); border-radius: 100px; overflow:hidden; }
  .cat-bar-row .fill{ height:100%; border-radius: 100px; transition: width 0.5s ease; }
  .cat-bar-row .amt{ width: 110px; text-align:right; flex-shrink:0; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink-secondary); }

  /* ─── SECTIONS ─── */
  .section-title{
    padding: 16px 24px 8px; font-size: 11px; color: var(--ink-tertiary);
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    border-top: 1px solid var(--border);
  }

  /* ─── PAYMENT BAR ─── */
  .payment-bar-wrap{ padding: 6px 24px 16px; }
  .payment-track{ height: 8px; background: var(--bg-subtle); border-radius: 100px; overflow:hidden; }
  .payment-fill{ height:100%; background: linear-gradient(90deg, var(--success), #34D399); border-radius: 100px; transition: width 0.5s ease; }
  .payment-caption{ font-size: 12px; color: var(--ink-tertiary); margin-top: 8px; display:flex; justify-content:space-between; font-weight: 500; }

  /* ─── FORMS ─── */
  form.entry-form, form.inline-form{
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display:grid; grid-template-columns: 1.3fr 1fr 1fr auto; gap: 10px; align-items:end;
  }
  form.inline-form{ grid-template-columns: 1fr 1fr auto; border-bottom:none; padding-top:8px; }
  @media (max-width: 640px){ form.entry-form, form.inline-form{ grid-template-columns: 1fr 1fr; } }
  form.entry-form label, form.inline-form label{
    font-size: 11px; color: var(--ink-tertiary); display:block; margin-bottom:4px;
    font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em;
  }
  form.entry-form select, form.entry-form input,
  form.inline-form select, form.inline-form input{
    width:100%; padding: 9px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--bg-subtle);
    color: var(--ink); font-size: 13px; font-family: inherit;
    transition: var(--transition);
  }
  form.entry-form select:focus, form.entry-form input:focus,
  form.inline-form select:focus, form.inline-form input:focus{
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }
  form.entry-form button, form.inline-form button{
    background: var(--primary); color:#fff; border:none;
    border-radius: var(--radius-sm); padding: 9px 18px; font-size: 13px;
    font-weight: 600; cursor:pointer; white-space:nowrap;
    transition: var(--transition); font-family: inherit;
  }
  form.entry-form button:hover, form.inline-form button:hover{
    background: var(--primary-hover); transform: translateY(-1px);
  }
  form.entry-form button.cancel-edit{
    background:none; border:1px solid var(--border); color:var(--ink-secondary);
  }

  /* ─── ENTRIES ─── */
  .entries{ max-height: 380px; overflow-y:auto; }
  .entries::-webkit-scrollbar{ width: 4px; }
  .entries::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 100px; }
  .entry{
    padding: 12px 24px; border-bottom: 1px solid var(--border-light);
    display:flex; justify-content:space-between; align-items:center; gap: 12px;
    font-size: 13px; transition: var(--transition);
  }
  .entry:hover{ background: var(--bg-subtle); }
  .entry .left{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .entry .desc{ font-weight: 600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entry .tag{ font-size: 11px; color: var(--ink-tertiary); display:flex; gap:6px; align-items:center; }
  .entry .dot{ width: 6px; height: 6px; border-radius: 50%; flex-shrink:0; }
  .entry .right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .entry .amt{ font-variant-numeric: tabular-nums; font-weight: 700; }
  .entry .amt.income{ color: var(--success); }
  .entry .amt.expense{ color: var(--danger); }
  .entry .edit, .entry .del{
    background:none; border:none; color: var(--ink-tertiary); cursor:pointer;
    font-size: 13px; padding: 4px 6px; border-radius: 6px;
    transition: var(--transition); opacity: 0.6;
  }
  .entry:hover .edit, .entry:hover .del{ opacity: 1; }
  .entry .del:hover{ color: var(--danger); background: var(--danger-light); }
  .entry .edit:hover{ color: var(--primary); background: var(--primary-light); }

  /* ─── EMPTY STATE ─── */
  .empty-state{
    padding: 80px 24px; text-align:center; color: var(--ink-tertiary);
  }
  .empty-state .big{
    font-size: 16px; color: var(--ink-secondary); font-weight: 600; margin-bottom:8px;
  }

  /* ─── MODALS ─── */
  dialog.modal{
    border:none; border-radius: var(--radius-xl); padding:0;
    max-width: 440px; width: calc(100% - 32px);
    background: var(--panel); color: var(--ink);
    box-shadow: var(--shadow-lg);
  }
  dialog.modal::backdrop{
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
  }
  .modal-pad{ padding: 28px; max-height: 80vh; overflow-y:auto; }
  .modal-pad h3{ margin:0 0 20px; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .modal-pad label{
    font-size: 11px; color: var(--ink-tertiary); display:block; margin: 14px 0 4px;
    font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .modal-pad input, .modal-pad select{
    width:100%; padding: 10px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--bg-subtle);
    color: var(--ink); font-size: 14px; font-family: inherit;
    transition: var(--transition);
  }
  .modal-pad input:focus, .modal-pad select:focus{
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:24px; }
  .btn-ghost{
    background: var(--bg-subtle); border: none; color:var(--ink-secondary);
    border-radius: var(--radius-sm); padding: 10px 18px; font-size: 13px;
    cursor:pointer; font-weight: 500; font-family: inherit; transition: var(--transition);
  }
  .btn-ghost:hover{ background: var(--border); }
  .btn-solid{
    background: var(--primary); border:none; color:#fff;
    border-radius: var(--radius-sm); padding: 10px 18px; font-size: 13px;
    font-weight: 600; cursor:pointer; font-family: inherit; transition: var(--transition);
  }
  .btn-solid:hover{ background: var(--primary-hover); }

  /* ─── WORKERS ─── */
  .worker-row{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding: 12px 0; border-bottom: 1px solid var(--border-light); font-size: 13px;
  }
  .worker-row:last-child{ border-bottom:none; }
  .worker-row .wname{ font-weight: 600; }
  .worker-row .wmeta{ font-size: 11px; color: var(--ink-tertiary); margin-top:2px; }
  .worker-row .wamt{ font-weight: 700; color: var(--warning); font-variant-numeric: tabular-nums; }

  /* ─── SCROLLBAR ─── */
  ::-webkit-scrollbar{ width: 6px; }
  ::-webkit-scrollbar-track{ background: transparent; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 100px; }

  /* ─── ANIMATIONS ─── */
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  .panel{ animation: fadeIn 0.3s ease; }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">P</div>
      <div>
        <div class="logo-text">PROVIK</div>
        <div class="logo-sub">Obyektlar hisobi</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="hbtn" id="openWorkersBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Ishchilar
      </button>
      <button class="hbtn" id="exportAllBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        CSV hisobot
      </button>
      <button class="hbtn" id="backupBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Zaxira
      </button>
      <button class="hbtn" id="restoreBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Yuklash
      </button>
      <input type="file" id="restoreFile" accept=".json,application/json" style="display:none;">
      <button class="hbtn" id="themeToggle" title="Tungi rejim" style="padding: 7px 9px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</div>
<div id="storageNote" style="display:none;"></div>

<div class="wrap">
  <div class="stats-grid">
    <div class="scard">
      <div class="s-label">Jami kelishilgan summa</div>
      <div class="s-value" id="totContract">0</div>
    </div>
    <div class="scard">
      <div class="s-label">Jami xarajat</div>
      <div class="s-value" id="totExpense">0</div>
    </div>
    <div class="scard profit">
      <div class="s-label">Umumiy foyda</div>
      <div class="s-value" id="totProfit">0</div>
    </div>
  </div>

  <div class="layout">
    <div class="panel">

        <h2>Obyektlar</h2>

<script>
  // Vercel Serverless Function (Neon PostgreSQL API) ga ulanish
  const API_URL = '/api/db'; 
  
  window.realDb = {
    collection: (name) => {
      return {
        onSnapshot: (cb) => {
          const poll = async () => {
            try {
              const res = await fetch(`${API_URL}?collection=${name}`);
              const col = await res.json();
              const data = {
                docs: Object.keys(col).map(id => ({
                  id,
                  data: () => col[id]
                }))
              };
              cb(data);
            } catch (e) {}
            setTimeout(poll, 3000);
          };
          poll();
          return () => {};
        },
        add: async (obj) => {
          const res = await fetch(`${API_URL}?collection=${name}`, {
            method: 'POST',
            body: JSON.stringify(obj),
            headers: { 'Content-Type': 'application/json' }
          });
          return await res.json();
        },
        doc: (id) => {
          return {
            update: async (patch) => {
              await fetch(`${API_URL}?collection=${name}&id=${id}`, {
                method: 'PUT',
                body: JSON.stringify(patch),
                headers: { 'Content-Type': 'application/json' }
              });
            },
            set: async (obj) => {
              await fetch(`${API_URL}?collection=${name}&id=${id}`, {
                method: 'PUT',
                body: JSON.stringify(obj),
                headers: { 'Content-Type': 'application/json' }
              });
            },
            delete: async () => {
              await fetch(`${API_URL}?collection=${name}&id=${id}`, {
                method: 'DELETE'
              });
            }
          };
        }
      };
    }
  };
</script>

<script>
/* Mustaqil (offline) rejim: ma'lumotlar shu qurilma brauzerida saqlanadi. */
(function(){
  const KEY = 'provik_hisob_v1';
  let data = {};
  let persistent = true;
  try{ data = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){ persistent = false; data = {}; }
  const listeners = {};
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(data)); }
    catch(e){ persistent = false; }
  }
  function snap(name){
    const col = data[name] || {};
    return { docs: Object.keys(col).map(id => ({ id, data: () => col[id] })) };
  }
  function notify(name){ (listeners[name] || []).forEach(cb => cb(snap(name))); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  const db = { collection(name){
    return {
      onSnapshot(cb){ (listeners[name] = listeners[name] || []).push(cb); setTimeout(() => cb(snap(name)), 0); return () => {}; },
      async add(obj){ const id = uid(); (data[name] = data[name] || {})[id] = obj; save(); notify(name); return { id }; },
      doc(id){
        return {
          async update(patch){ const c = data[name] || {}; if(c[id]){ c[id] = Object.assign({}, c[id], patch); save(); notify(name); } },
          async set(obj){ (data[name] = data[name] || {})[id] = obj; save(); notify(name); },
          async delete(){ if(data[name]){ delete data[name][id]; save(); notify(name); } }
        };
      }
    };
  }};
  function download(filename, text, mime){
    const blob = new Blob([text], { type: mime + ';charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  async function saveFile(filename, text, mime){
    try{
      if(window.claude && typeof window.claude.use === 'function'){
        const dl = await window.claude.use('downloads');
        if(dl){ await dl.save({ filename, data: text }); return; }
      }
    }catch(e){ return; }
    download(filename, text, mime);
  }
  window.__localUse = async function(cap){
    if(cap === 'db') return db;
    if(cap === 'downloads') return { save: async ({ filename, data: d }) => saveFile(filename, d, 'text/csv') };
    throw new Error('unavailable');
  };

  const backupBtn = document.getElementById('backupBtn');
  const restoreBtn = document.getElementById('restoreBtn');
  const restoreFile = document.getElementById('restoreFile');
  if(backupBtn) backupBtn.addEventListener('click', () => {
    const d = new Date(); const p = n => String(n).padStart(2, '0');
    const name = 'PROVIK_zaxira_' + d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + '.json';
    saveFile(name, JSON.stringify(data), 'application/json');
  });
  if(restoreBtn && restoreFile){
    restoreBtn.addEventListener('click', () => restoreFile.click());
    restoreFile.addEventListener('change', () => {
      const f = restoreFile.files && restoreFile.files[0];
      if(!f) return;
      const r = new FileReader();
      r.onload = () => {
        try{
          const inc = JSON.parse(r.result);
          if(!inc || typeof inc !== 'object') throw new Error('bad');
          let n = 0;
          ['objects','entries','payments','workers'].forEach(name => {
            const col = inc[name]; if(!col || typeof col !== 'object') return;
            data[name] = data[name] || {};
            Object.keys(col).forEach(id => { data[name][id] = col[id]; n++; });
          });
          save();
          ['objects','entries','payments','workers'].forEach(notify);
          alert("Zaxira birlashtirildi: " + n + " ta yozuv qo'shildi/yangilandi.");
        }catch(e){ alert("Fayl noto'g'ri. PROVIK zaxira faylini (.json) tanlang."); }
        restoreFile.value = '';
      };
      r.readAsText(f);
    });
  }
  window.addEventListener('load', () => {
    if(!persistent){
      const n = document.getElementById('storageNote');
      if(n){ n.textContent = "Diqqat: brauzer ma'lumotni saqlamayapti."; n.style.color = 'var(--danger)'; n.style.display = 'block'; }
    }
  });
})();
</script>
<script>
(function(){
  const CATS = [
    {id:'ventjihoz', name:"Ventilyatsiya jihozlari", color:'#2563EB'},
    {id:'kondit', name:"Konditsionerlar", color:'#059669'},
    {id:'vrf', name:"VRF tizimi materiallari", color:'#7C3AED'},
    {id:'vozduxovod', name:"Vozduxovod", color:'#0891B2'},
    {id:'medtruba', name:"Med truba", color:'#B45309'},
    {id:'izolyatsiya', name:"Izolyatsiya", color:'#E11D48'},
    {id:'metizi', name:"Metizi", color:'#4F46E5'},
    {id:'ishchi', name:"Ishchilarga pul", color:'#D97706'},
    {id:'dastavka', name:"Dastavka", color:'#DC2626'},
    {id:'boshqa', name:"Boshqa xarajat", color:'#6B7280'}
  ];
  const STATUS_LABELS = { jarayonda: 'Jarayonda', tugallangan: 'Tugallangan', toxtatilgan: "To'xtatilgan" };

  let state = { objects: [], activeId: null };
  let workers = [];
  let db = null;
  let assetsCap = null;
  let downloadsCap = null;
  let dbStatus = 'connecting';
  let filterMonth = '';
  let editingEntryId = null;

  const rawObjects = new Map();
  const rawEntries = new Map();
  const rawPayments = new Map();
  const rawWorkers = new Map();

  function rebuildStateFromRaw(){
    const entriesByObj = new Map();
    rawEntries.forEach((e, id)=>{
      const list = entriesByObj.get(e.objId) || [];
      list.push({ id, ...e });
      entriesByObj.set(e.objId, list);
    });
    const paymentsByObj = new Map();
    rawPayments.forEach((p, id)=>{
      const list = paymentsByObj.get(p.objId) || [];
      list.push({ id, ...p });
      paymentsByObj.set(p.objId, list);
    });
    state.objects = Array.from(rawObjects.entries()).map(([id, o])=>({
      id, name: o.name, contract: o.contract,
      settlementType: o.settlementType || 'naqd',
      vatPercent: o.vatPercent,
      status: o.status || 'jarayonda',
      createdAt: o.createdAt || 0,
      entries: entriesByObj.get(id) || [],
      payments: paymentsByObj.get(id) || []
    })).sort((a,b)=> (a.createdAt||0) - (b.createdAt||0) || a.name.localeCompare(b.name));
    if(!state.activeId && state.objects.length) state.activeId = state.objects[0].id;
    if(state.activeId && !state.objects.find(o=>o.id===state.activeId)){
      state.activeId = state.objects[0]?.id || null;
    }
    workers = Array.from(rawWorkers.entries())
      .map(([id,w])=>({ id, name: w.name, createdAt: w.createdAt||0 }))
      .sort((a,b)=> a.name.localeCompare(b.name));
  }

  async function initDb(){
    try{
      db = window.realDb || await window.__localUse('db');
    }catch(e){ db = window.realDb || null; }

    if(!db){
      dbStatus = 'unavailable';
      renderAll();
      return;
    }
    dbStatus = 'ready';

    db.collection('objects').onSnapshot(snap=>{
      rawObjects.clear();
      snap.docs.forEach(d=>{ const data = d.data(); if(data) rawObjects.set(d.id, data); });
      rebuildStateFromRaw();
      renderAll();
    }, err=>{ console.error('objects snapshot error', err); });

    db.collection('entries').onSnapshot(snap=>{
      rawEntries.clear();
      snap.docs.forEach(d=>{ const data = d.data(); if(data) rawEntries.set(d.id, data); });
      rebuildStateFromRaw();
      renderAll();
    }, err=>{ console.error('entries snapshot error', err); });

    db.collection('payments').onSnapshot(snap=>{
      rawPayments.clear();
      snap.docs.forEach(d=>{ const data = d.data(); if(data) rawPayments.set(d.id, data); });
      rebuildStateFromRaw();
      renderAll();
    }, err=>{ console.error('payments snapshot error', err); });

    db.collection('workers').onSnapshot(snap=>{
      rawWorkers.clear();
      snap.docs.forEach(d=>{ const data = d.data(); if(data) rawWorkers.set(d.id, data); });
      rebuildStateFromRaw();
      renderAll();
    }, err=>{ console.error('workers snapshot error', err); });

    assetsCap = null;
    try{ downloadsCap = await window.__localUse('downloads'); }catch(e){ downloadsCap = null; }
    renderAll();
  }

  function fmt(n){
    n = Math.round(Number(n)||0);
    return n.toLocaleString('ru-RU').replace(/,/g,' ') + " so'm";
  }

  function csvEscape(v){
    v = v==null ? '' : String(v);
    if(/[",\n;]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
    return v;
  }

  async function downloadCsv(filename, rows){
    if(!downloadsCap) return;
    const csv = '\uFEFF' + rows.map(r=> r.map(csvEscape).join(';')).join('\r\n');
    try{ await downloadsCap.save({ filename, data: csv }); }
    catch(e){ console.error('csv export error', e); }
  }

  function exportOverallCsv(){
    const rows = [['Obyekt','Holati','Kelishuv turi','Kelishilgan summa','Sof summa','NDS summasi','Jami xarajat','Foyda',"To'langan",'Qolgan']];
    state.objects.forEach(o=>{
      const t = objTotals(o);
      const type = o.settlementType==='nds' ? ('NDS ' + o.vatPercent + '%') : 'Naqd';
      rows.push([o.name, STATUS_LABELS[o.status]||o.status, type, t.contract, Math.round(t.netAmount), Math.round(t.vatAmount), t.expense, t.profit, t.paid, t.remaining]);
    });
    downloadCsv('PROVIK_hisobot.csv', rows);
  }

  function exportObjectCsv(obj, entries){
    const rows = [['Sana','Tavsif','Toifa','Ishchi','Summa']];
    entries.forEach(e=>{
      const cat = CATS.find(c=>c.id===e.cat) || CATS[CATS.length-1];
      const w = e.workerId ? workers.find(x=>x.id===e.workerId) : null;
      rows.push([e.date||'', e.desc||'', cat.name, w?w.name:'', e.amount]);
    });
    const safeName = (obj.name||'obyekt').replace(/[^\p{L}\p{N}]+/gu,'_');
    downloadCsv(safeName + '_xarajatlar.csv', rows);
  }

  function objTotals(obj){
    let expense = 0;
    const byCat = {};
    CATS.forEach(c=> byCat[c.id]=0);
    (obj.entries||[]).forEach(e=>{
      expense += Number(e.amount)||0;
      byCat[e.cat] = (byCat[e.cat]||0) + (Number(e.amount)||0);
    });
    const contract = Number(obj.contract)||0;
    const profit = contract - expense;
    let vatAmount = 0, netAmount = contract;
    if(obj.settlementType === 'nds' && obj.vatPercent){
      const pct = Number(obj.vatPercent)||0;
      netAmount = contract / (1 + pct/100);
      vatAmount = contract - netAmount;
    }
    const paid = (obj.payments||[]).reduce((s,p)=> s + (Number(p.amount)||0), 0);
    const remaining = contract - paid;
    const paidPct = contract>0 ? Math.min(100, Math.round((paid/contract)*100)) : 0;
    return { expense, contract, profit, byCat, vatAmount, netAmount, paid, remaining, paidPct };
  }

  function renderTotals(){
    let contract=0, expense=0, paid=0;
    state.objects.forEach(o=>{
      const t = objTotals(o);
      contract += t.contract; expense += t.expense; paid += t.paid;
    });
    const profit = contract - expense;
    document.getElementById('totContract').textContent = fmt(contract);
    document.getElementById('totExpense').textContent = fmt(expense);
    const profitEl = document.getElementById('totProfit');
    profitEl.textContent = fmt(profit);
    profitEl.parentElement.classList.toggle('neg', profit < 0);
    const exportAllBtn = document.getElementById('exportAllBtn');
    if(exportAllBtn){
      exportAllBtn.disabled = !downloadsCap;
      exportAllBtn.title = downloadsCap ? '' : "Bu ko'rinishda mavjud emas";
    }
  }

  function renderObjList(){
    const list = document.getElementById('objList');
    if(dbStatus === 'unavailable'){
      list.innerHTML = '<div class="empty-list">Saqlash tizimiga ulanib bo\'lmadi.</div>';
      return;
    }
    if(state.objects.length === 0){
      list.innerHTML = '<div class="empty-list">Hali obyekt yo\'q.<br>Yuqoridagi <strong>+</strong> tugmasini bosing.</div>';
      return;
    }
    list.innerHTML = state.objects.map(o=>{
      const t = objTotals(o);
      const cls = t.profit < 0 ? 'neg' : 'pos';
      const typeBadge = o.settlementType==='nds'
        ? ('<span class="badge nds">NDS ' + o.vatPercent + '%</span>')
        : '<span class="badge naqd">Naqd</span>';
      const statusBadge = '<span class="badge status-' + o.status + '">' + (STATUS_LABELS[o.status]||o.status) + '</span>';
      return `<div class="obj-item ${o.id===state.activeId?'active':''}" data-id="${o.id}">
        <div class="name"><span>${escapeHtml(o.name)}</span><span style="display:flex; gap:4px; flex-wrap:wrap;">${statusBadge}${typeBadge}</span></div>
        <div class="meta"><span>${(o.entries||[]).length} ta xarajat</span><span class="p ${cls}">${fmt(t.profit)}</span></div>
      </div>`;
    }).join('');
    list.querySelectorAll('.obj-item').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.activeId = el.getAttribute('data-id');
        editingEntryId = null;
        renderAll();
      });
    });
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function workerOptionsHtml(selectedId){
    const opts = workers.map(w=> `<option value="${w.id}" ${w.id===selectedId?'selected':''}>${escapeHtml(w.name)}</option>`).join('');
    return `<option value="">— tanlanmagan —</option>${opts}<option value="__new__">+ Yangi ishchi</option>`;
  }

  function renderDetail(){
    const panel = document.getElementById('detailPanel');
    const obj = state.objects.find(o=>o.id===state.activeId);
    if(!obj){
      panel.innerHTML = `<div class="empty-state">
        <div class="big">Obyekt tanlanmagan</div>
        <div>Chapdagi ro'yxatdan obyekt tanlang yoki yangisini qo'shing.</div>
      </div>`;
      return;
    }
    const t = objTotals(obj);
    const catRows = CATS.map(c=>{
      const amt = t.byCat[c.id]||0;
      const pct = t.expense>0 ? Math.round((amt/t.expense)*100) : 0;
      if(amt===0) return '';
      return `<div class="cat-bar-row">
        <div class="cn">${c.name}</div>
        <div class="track"><div class="fill" style="width:${pct}%; background:${c.color}"></div></div>
        <div class="amt">${fmt(amt)}</div>
      </div>`;
    }).join('');

    const allEntries = (obj.entries||[]).slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.createdAt-a.createdAt);
    const entries = filterMonth ? allEntries.filter(e=> (e.date||'').slice(0,7) === filterMonth) : allEntries;
    const filteredExpense = entries.reduce((s,e)=> s + (Number(e.amount)||0), 0);
    const editingEntry = editingEntryId ? allEntries.find(e=>e.id===editingEntryId) : null;

    const entriesHtml = entries.length ? entries.map(e=>{
      const cat = CATS.find(c=>c.id===e.cat) || CATS[CATS.length-1];
      const workerName = e.workerId ? (workers.find(w=>w.id===e.workerId)?.name) : null;
      const receipt = e.receiptId ? `<a href="/_blob/${e.receiptId}" target="_blank" rel="noopener" title="Chekni ko'rish" style="flex-shrink:0;">
          <img src="/_blob/${e.receiptId}" alt="chek" style="width:32px;height:32px;object-fit:cover;border-radius:6px;border:1px solid var(--border);">
        </a>` : '';
      return `<div class="entry" data-eid="${e.id}">
        <div class="left">
          <div class="desc">${escapeHtml(e.desc || cat.name)}</div>
          <div class="tag"><span class="dot" style="background:${cat.color}"></span>${cat.name}${workerName?' · '+escapeHtml(workerName):''}${e.date? ' · '+e.date : ''}</div>
        </div>
        <div class="right">
          ${receipt}
          <div class="amt expense">-${fmt(e.amount)}</div>
          <button class="edit" data-eid="${e.id}" title="Tahrirlash">✎</button>
          <button class="del" data-eid="${e.id}" title="O'chirish">✕</button>
        </div>
      </div>`;
    }).join('') : `<div class="empty-list">${filterMonth ? "Shu oyda xarajat yo'q." : "Hali xarajat kiritilmagan."}</div>`;

    const payments = (obj.payments||[]).slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.createdAt-a.createdAt);
    const paymentsHtml = payments.length ? payments.map(p=> `
      <div class="entry" data-pid="${p.id}">
        <div class="left">
          <div class="desc">${escapeHtml(p.note || "To'lov")}</div>
          <div class="tag">${p.date||''}</div>
        </div>
        <div class="right">
          <div class="amt income">+${fmt(p.amount)}</div>
          <button class="del" data-pid="${p.id}" title="O'chirish">✕</button>
        </div>
      </div>`).join('') : '<div class="empty-list">Hali to\'lov kiritilmagan.</div>';

    panel.innerHTML = `
      <div class="detail-head">
        <div>
          <h2>${escapeHtml(obj.name)}</h2>
          <div class="contract">Kelishilgan summa: ${fmt(obj.contract)} · ${obj.settlementType==='nds' ? ('NDS bilan (' + obj.vatPercent + '%)') : 'Naqd shaklda'}</div>
          ${obj.settlementType==='nds' ? `<div class="contract">Shundan: sof summa ${fmt(t.netAmount)}, NDS summasi ${fmt(t.vatAmount)}</div>` : ''}
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <select class="status-select" id="statusSelect">
            <option value="jarayonda" ${obj.status==='jarayonda'?'selected':''}>Jarayonda</option>
            <option value="tugallangan" ${obj.status==='tugallangan'?'selected':''}>Tugallangan</option>
            <option value="toxtatilgan" ${obj.status==='toxtatilgan'?'selected':''}>To'xtatilgan</option>
          </select>
          <button class="icon-btn" id="delObjBtn">O'chirish</button>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat income"><div class="lbl">Kelishilgan</div><div class="val">${fmt(t.contract)}</div></div>
        <div class="stat expense"><div class="lbl">Xarajat</div><div class="val">${fmt(t.expense)}</div></div>
        <div class="stat profit ${t.profit<0?'neg':''}"><div class="lbl">Foyda</div><div class="val">${fmt(t.profit)}</div></div>
      </div>
      ${catRows ? `<div class="cat-bars">${catRows}</div>` : ''}

      <div class="section-title">Mijoz to'lovlari</div>
      <div class="payment-bar-wrap">
        <div class="payment-track"><div class="payment-fill" style="width:${t.paidPct}%;"></div></div>
        <div class="payment-caption">
          <span>To'langan: ${fmt(t.paid)} (${t.paidPct}%)</span>
          <span>Qolgan: ${fmt(t.remaining)}</span>
        </div>
      </div>
      <form class="inline-form" id="paymentForm">
        <div>
          <label for="pAmt">To'lov summasi</label>
          <input id="pAmt" type="number" min="0" step="1" placeholder="0" required>
        </div>
        <div>
          <label for="pNote">Izoh (ixtiyoriy)</label>
          <input id="pNote" type="text" placeholder="Masalan: 2-bosqich">
        </div>
        <button type="submit">Qo'shish</button>
      </form>
      <div class="entries" style="max-height:180px;">${paymentsHtml}</div>

      <div class="section-title">${editingEntry ? "Xarajatni tahrirlash" : "Xarajat qo'shish"}</div>
      <form class="entry-form" id="entryForm">
        <div style="grid-column: span 1;">
          <label for="eDesc">Tavsif</label>
          <input id="eDesc" type="text" placeholder="Masalan: kompressor" value="${editingEntry?escapeHtml(editingEntry.desc||''):''}">
        </div>
        <div>
          <label for="eCat">Toifa</label>
          <select id="eCat">${CATS.map(c=>`<option value="${c.id}" ${editingEntry&&editingEntry.cat===c.id?'selected':''}>${c.name}</option>`).join('')}</select>
        </div>
        <div>
          <label for="eAmt">Summa (so'm)</label>
          <input id="eAmt" type="number" min="0" step="1" placeholder="0" required value="${editingEntry?editingEntry.amount:''}">
        </div>
        <button type="submit">${editingEntry ? "Yangilash" : "Qo'shish"}</button>
        <div id="workerFieldWrap" style="grid-column: 1 / -1; display:none;">
          <label for="eWorker">Ishchi</label>
          <select id="eWorker">${workerOptionsHtml(editingEntry?editingEntry.workerId:null)}</select>
        </div>
        <div style="grid-column: 1 / -1;${assetsCap ? '' : 'display:none;'}">
          <label for="eReceipt">Chek/rasm (ixtiyoriy)</label>
          <input id="eReceipt" type="file" accept="image/*" ${assetsCap ? '' : 'disabled'} style="padding:4px 0; border:none; background:none;">
        </div>
        ${editingEntry ? `<button type="button" class="cancel-edit" id="cancelEditBtn" style="grid-column:1/-1;">Bekor qilish</button>` : ''}
      </form>

      <div style="padding: 12px 24px; border-bottom: 1px solid var(--border); display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <label for="filterMonthInput" style="font-size:11px; color:var(--ink-tertiary); font-weight:500;">Oy bo'yicha:</label>
        <input type="month" id="filterMonthInput" value="${filterMonth}" style="padding:7px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-subtle); color:var(--ink); font-size:12px; font-family:inherit;">
        ${filterMonth ? `<button class="icon-btn" id="clearFilterBtn">Barchasi</button><span style="font-size:12px;color:var(--ink-tertiary);">Shu oyda: ${fmt(filteredExpense)}</span>` : ''}
        <button class="icon-btn" id="exportObjBtn" style="margin-left:auto;" ${downloadsCap ? '' : 'disabled title="Mavjud emas"'}>CSV yuklab olish</button>
      </div>
      <div class="entries">${entriesHtml}</div>
    `;

    const catSelect = document.getElementById('eCat');
    const workerWrap = document.getElementById('workerFieldWrap');
    function syncWorkerVisibility(){
      workerWrap.style.display = catSelect.value === 'ishchi' ? 'block' : 'none';
    }
    catSelect.addEventListener('change', syncWorkerVisibility);
    syncWorkerVisibility();

    document.getElementById('eWorker').addEventListener('change', (ev)=>{
      if(ev.target.value === '__new__'){
        ev.target.value = '';
        document.getElementById('workersModal').showModal();
        renderWorkersModal();
        const nameInput = document.getElementById('newWorkerName');
        if(nameInput) nameInput.focus();
      }
    });

    document.getElementById('statusSelect').addEventListener('change', async (ev)=>{
      if(!db) return;
      try{ await db.collection('objects').doc(obj.id).update({ status: ev.target.value }); }
      catch(e){ console.error('status update error', e); }
    });

    document.getElementById('delObjBtn').addEventListener('click', ()=>{
      askConfirm(`"${obj.name}" obyektini butunlay o'chirasizmi?`, async ()=>{
        if(!db) return;
        try{
          await Promise.all((obj.entries||[]).map(e=> db.collection('entries').doc(e.id).delete()));
          await Promise.all((obj.payments||[]).map(p=> db.collection('payments').doc(p.id).delete()));
          await db.collection('objects').doc(obj.id).delete();
          if(state.activeId===obj.id) state.activeId = null;
        }catch(e){ console.error('delete object error', e); }
      });
    });

    document.getElementById('filterMonthInput').addEventListener('change', (ev)=>{
      filterMonth = ev.target.value || '';
      renderDetail();
    });
    const clearBtn = document.getElementById('clearFilterBtn');
    if(clearBtn) clearBtn.addEventListener('click', ()=>{ filterMonth = ''; renderDetail(); });
    document.getElementById('exportObjBtn').addEventListener('click', ()=>{
      exportObjectCsv(obj, entries);
    });

    const cancelEditBtn = document.getElementById('cancelEditBtn');
    if(cancelEditBtn) cancelEditBtn.addEventListener('click', ()=>{ editingEntryId = null; renderDetail(); });

    document.getElementById('entryForm').addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const desc = document.getElementById('eDesc').value.trim();
      const cat = document.getElementById('eCat').value;
      const amt = Number(document.getElementById('eAmt').value);
      const workerSel = document.getElementById('eWorker').value;
      const workerId = (cat==='ishchi' && workerSel && workerSel!=='__new__') ? workerSel : null;
      const fileInput = document.getElementById('eReceipt');
      const file = fileInput && fileInput.files && fileInput.files[0];
      if(!amt || amt<=0 || !db) return;
      const btn = ev.target.querySelector('button[type="submit"]');
      if(btn) btn.disabled = true;
      try{
        let receiptId = null;
        if(file && assetsCap){
          try{ const up = await assetsCap.upload(file); receiptId = up.id; }
          catch(e){ console.error('receipt upload error', e); }
        }
        if(editingEntryId){
          const payload = { desc, cat, amount: amt, workerId: workerId || null };
          if(receiptId) payload.receiptId = receiptId;
          await db.collection('entries').doc(editingEntryId).update(payload);
          editingEntryId = null;
        } else {
          const payload = {
            objId: obj.id, desc, cat, amount: amt,
            date: new Date().toISOString().slice(0,10),
            createdAt: Date.now()
          };
          if(workerId) payload.workerId = workerId;
          if(receiptId) payload.receiptId = receiptId;
          await db.collection('entries').add(payload);
        }
        ev.target.reset();
        renderDetail();
      }catch(e){ console.error('save entry error', e); }
      if(btn) btn.disabled = false;
    });

    panel.querySelectorAll('.entry .del[data-eid]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const eid = btn.getAttribute('data-eid');
        askConfirm('Ushbu xarajatni o\'chirasizmi?', async ()=>{
          if(!db) return;
          try{ await db.collection('entries').doc(eid).delete(); }
          catch(e){ console.error('delete entry error', e); }
        });
      });
    });

    panel.querySelectorAll('.entry .edit[data-eid]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        editingEntryId = btn.getAttribute('data-eid');
        renderDetail();
        const form = document.getElementById('entryForm');
        if(form) form.scrollIntoView({ behavior:'smooth', block:'center' });
      });
    });

    document.getElementById('paymentForm').addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const amt = Number(document.getElementById('pAmt').value);
      const note = document.getElementById('pNote').value.trim();
      if(!amt || amt<=0 || !db) return;
      const btn = ev.target.querySelector('button[type="submit"]');
      if(btn) btn.disabled = true;
      try{
        await db.collection('payments').add({
          objId: obj.id, amount: amt, note,
          date: new Date().toISOString().slice(0,10),
          createdAt: Date.now()
        });
        ev.target.reset();
      }catch(e){ console.error('add payment error', e); }
      if(btn) btn.disabled = false;
    });

    panel.querySelectorAll('.entry .del[data-pid]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const pid = btn.getAttribute('data-pid');
        askConfirm('Ushbu to\'lovni o\'chirasizmi?', async ()=>{
          if(!db) return;
          try{ await db.collection('payments').doc(pid).delete(); }
          catch(e){ console.error('delete payment error', e); }
        });
      });
    });
  }

  function renderWorkersModal(){
    const list = document.getElementById('workersList');
    if(!workers.length){
      list.innerHTML = '<div class="empty-list">Hali ishchi yo\'q.</div>';
      return;
    }
    const totals = new Map();
    const counts = new Map();
    rawEntries.forEach(e=>{
      if(!e.workerId) return;
      totals.set(e.workerId, (totals.get(e.workerId)||0) + (Number(e.amount)||0));
      counts.set(e.workerId, (counts.get(e.workerId)||0) + 1);
    });
    list.innerHTML = workers.map(w=>{
      const total = totals.get(w.id) || 0;
      const count = counts.get(w.id) || 0;
      return `<div class="worker-row" data-wid="${w.id}">
        <div>
          <div class="wname">${escapeHtml(w.name)}</div>
          <div class="wmeta">${count} ta to'lov</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="wamt">${fmt(total)}</div>
          <button class="del" data-wid="${w.id}" title="O'chirish">✕</button>
        </div>
      </div>`;
    }).join('');
    list.querySelectorAll('.del[data-wid]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const wid = btn.getAttribute('data-wid');
        askConfirm("Ushbu ishchini ro'yxatdan o'chirasizmi?", async ()=>{
          if(!db) return;
          try{ await db.collection('workers').doc(wid).delete(); renderWorkersModal(); }
          catch(e){ console.error('delete worker error', e); }
        });
      });
    });
  }

  function renderAll(){
    renderTotals();
    renderObjList();
    // Agar foydalanuvchi detail panelda input/select ga yozayotgan bo'lsa,
    // qayta render qilmaymiz (aks holda mobilda klaviatura yopiladi)
    const detail = document.getElementById('detailPanel');
    const active = document.activeElement;
    const isTyping = active && detail && detail.contains(active) &&
      (active.tagName === 'INPUT' || active.tagName === 'SELECT' || active.tagName === 'TEXTAREA');
    if(!isTyping){
      renderDetail();
    }
    if(document.getElementById('workersModal').open) renderWorkersModal();
  }

  // Add object modal
  const addObjModal = document.getElementById('addObjModal');
  document.getElementById('openAddObj').addEventListener('click', ()=>{
    document.getElementById('newObjName').value='';
    document.getElementById('newObjContract').value='';
    document.getElementById('newObjSettlement').value='naqd';
    document.getElementById('newObjVatPct').value='12';
    document.getElementById('newObjVatWrap').style.display='none';
    document.getElementById('newObjStatus').value='jarayonda';
    addObjModal.showModal();
    document.getElementById('newObjName').focus();
  });
  document.getElementById('newObjSettlement').addEventListener('change', (ev)=>{
    document.getElementById('newObjVatWrap').style.display = ev.target.value==='nds' ? 'block' : 'none';
  });
  document.getElementById('cancelAddObj').addEventListener('click', ()=> addObjModal.close());
  document.getElementById('saveAddObj').addEventListener('click', async ()=>{
    const name = document.getElementById('newObjName').value.trim();
    const contract = Number(document.getElementById('newObjContract').value)||0;
    const settlementType = document.getElementById('newObjSettlement').value;
    const vatPercent = settlementType==='nds' ? (Number(document.getElementById('newObjVatPct').value)||0) : null;
    const status = document.getElementById('newObjStatus').value;
    if(!name || !db) return;
    const saveBtn = document.getElementById('saveAddObj');
    saveBtn.disabled = true;
    try{
      const payload = { name, contract, settlementType, status, createdAt: Date.now() };
      if(vatPercent!=null) payload.vatPercent = vatPercent;
      const ref = await db.collection('objects').add(payload);
      state.activeId = ref.id;
      addObjModal.close();
    }catch(e){ console.error('add object error', e); }
    saveBtn.disabled = false;
  });

  // Confirm modal
  const confirmModal = document.getElementById('confirmModal');
  let confirmCb = null;
  function askConfirm(text, cb){
    document.getElementById('confirmText').textContent = text;
    confirmCb = cb;
    confirmModal.showModal();
  }
  document.getElementById('confirmCancel').addEventListener('click', ()=>{ confirmModal.close(); confirmCb=null; });
  document.getElementById('confirmOk').addEventListener('click', ()=>{
    confirmModal.close();
    if(confirmCb) confirmCb();
    confirmCb = null;
  });

  // Workers modal
  const workersModal = document.getElementById('workersModal');
  document.getElementById('openWorkersBtn').addEventListener('click', ()=>{
    workersModal.showModal();
    renderWorkersModal();
  });
  document.getElementById('closeWorkersBtn').addEventListener('click', ()=> workersModal.close());
  document.getElementById('addWorkerForm').addEventListener('submit', async (ev)=>{
    ev.preventDefault();
    const input = document.getElementById('newWorkerName');
    const name = input.value.trim();
    if(!name || !db) return;
    try{ await db.collection('workers').add({ name, createdAt: Date.now() }); input.value=''; }
    catch(e){ console.error('add worker error', e); }
  });

  // Theme toggle
  const themeToggle = document.getElementById('themeToggle');
  document.getElementById('exportAllBtn').addEventListener('click', exportOverallCsv);
  function applyThemeLabel(){
    const cur = document.documentElement.getAttribute('data-theme');
    themeToggle.innerHTML = cur === 'dark'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    themeToggle.title = cur === 'dark' ? 'Kunduzgi rejim' : 'Tungi rejim';
  }
  themeToggle.addEventListener('click', ()=>{
    const cur = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur==='dark' ? 'light' : 'dark');
    applyThemeLabel();
  });
  applyThemeLabel();

  renderAll();
  initDb();
})();
</script>
</body>
</html>
